kind = "web"
previewPath = "/"
title = "AI Guide"
description = "A safe, beginner-friendly AI learning tool with plain-language explanations and hands-on practice for AI and related systems."
version = "1.0.0"
id = "artifacts/edgley-detailing"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23599

[services.development]
run = "pnpm --filter @workspace/edgley-detailing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/edgley-detailing", "run", "build" ]
serve = "static"
publicDir = "artifacts/edgley-detailing/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23599"
BASE_PATH = "/"
